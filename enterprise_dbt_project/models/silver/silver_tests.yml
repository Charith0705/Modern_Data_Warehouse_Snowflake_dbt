version: 2

models:
  - name: silver_orders
    columns:
      - name: order_id
        tests:
          - not_null
          - unique

      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('silver_customer')
              field: customer_id

  - name: silver_customer
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique

  - name: silver_lineitem
    columns:
      - name: order_id
        tests:
          - not_null